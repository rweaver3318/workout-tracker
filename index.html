<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d6e4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Weaver Workout">
  <meta name="description" content="Ron & Cindy Weaver 8-week rehab + strength tracker (Arnold programs)">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <title>Weaver Workout — Ron &amp; Cindy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-row">
      <div class="header-title">
        <h1>Weaver Workout</h1>
        <div class="sub" id="header-sub">Arnold programs</div>
      </div>
      <div class="person-switch" role="group" aria-label="Choose person">
        <button type="button" data-person="ron" aria-pressed="true">Ron</button>
        <button type="button" data-person="cindy" aria-pressed="false">Cindy</button>
      </div>
    </div>
  </header>

  <main>
    <section id="view-today" class="view"></section>
    <section id="view-pick" class="view hidden"></section>
    <section id="view-progress" class="view hidden"></section>
    <section id="view-settings" class="view hidden"></section>
  </main>

  <nav class="nav" aria-label="Main">
    <button type="button" data-view="today" class="active"><span aria-hidden="true">●</span>Today</button>
    <button type="button" data-view="pick"><span aria-hidden="true">☰</span>Days</button>
    <button type="button" data-view="progress"><span aria-hidden="true">▲</span>Progress</button>
    <button type="button" data-view="settings"><span aria-hidden="true">⚙</span>Settings</button>
  </nav>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
